%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/qcom,pcie-sm7350.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SM7350 PCI Express Root Complex

maintainers:
  - Claude Agent <claude-agent@localhost>

description:
  The SM7350 PCIe root complex is based on the Synopsys DesignWare PCIe IP.
  Unlike the SM8350 variant it does not expose the TBU/DDRSS sideband clocks
  in the GCC block, so its clock list is shorter.

properties:
  compatible:
    const: qcom,pcie-sm7350

  reg:
    minItems: 5
    maxItems: 5

  reg-names:
    items:
      - const: parf
      - const: dbi
      - const: elbi
      - const: atu
      - const: config

  clocks:
    minItems: 7
    maxItems: 7

  clock-names:
    items:
      - const: aux
      - const: cfg
      - const: bus_master
      - const: bus_slave
      - const: slave_q2a
      - const: aggre1
      - const: aggre0

  interrupts:
    minItems: 9
    maxItems: 9

  interrupt-names:
    items:
      - const: msi0
      - const: msi1
      - const: msi2
      - const: msi3
      - const: msi4
      - const: msi5
      - const: msi6
      - const: msi7
      - const: global

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: pci

  vdda-supply:
    description: PCIe controller analog supply

  vddpe-3v3-supply:
    description: 3.3V supply for the PCIe endpoint slot

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - power-domains
  - resets
  - reset-names

allOf:
  - $ref: qcom,pcie-common.yaml#

unevaluatedProperties: false

