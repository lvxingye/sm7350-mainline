%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/qcom,pci-msi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PCIe MSI doorbell controller

maintainers:
  - Claude Agent <claude-agent@localhost>

description: |
  Some Qualcomm PCIe host controllers do not use the Synopsys DWC
  iMSI-RX window. Instead the PCIe host exposes a single MSI doorbell
  register; a write to that register with a GIC SPI number in its data
  payload raises the corresponding GIC SPI.

  The node is referenced from the PCIe host controller through the
  standard "msi-parent" property.

properties:
  compatible:
    const: qcom,pci-msi

  reg:
    maxItems: 1

  msi-controller: true

  '#msi-cells':
    const: 0

  interrupts:
    minItems: 1
    maxItems: 32

required:
  - compatible
  - reg
  - msi-controller
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    msi-controller@17a10040 {
        compatible = "qcom,pci-msi";
        reg = <0x17a10040 0x1000>;
        msi-controller;
        #msi-cells = <0>;
        interrupt-parent = <&intc>;
        interrupts = <GIC_SPI 768 IRQ_TYPE_EDGE_RISING>,
                     <GIC_SPI 769 IRQ_TYPE_EDGE_RISING>;
    };
...
